# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

logo:
  src: /images/uploads/logo.png

backend:
  name: github
  repo: kevineulenberg/bringmal-changelog
  branch: main
  base_url: https://changelog.bringmal.app
  auth_endpoint: oauth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "shop"
    label: "Shop"
    folder: "src/content/shop"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Typ", name: "type", widget: "select", options: ["feature", "fix", "improvement", "announcement"], default: "feature" }
      - { label: "Version", name: "version", widget: "string", required: false, hint: "Optional, z.B. 2.0" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: false, hint: "Wird nicht öffentlich angezeigt" }
      - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "tischreservierungen"
    label: "Tischreservierungen"
    folder: "src/content/tischreservierungen"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Typ", name: "type", widget: "select", options: ["feature", "fix", "improvement", "announcement"], default: "feature" }
      - { label: "Version", name: "version", widget: "string", required: false, hint: "Optional, z.B. 2.0" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: false, hint: "Wird nicht öffentlich angezeigt" }
      - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "app"
    label: "App"
    folder: "src/content/app"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Typ", name: "type", widget: "select", options: ["feature", "fix", "improvement", "announcement"], default: "feature" }
      - { label: "Version", name: "version", widget: "string", required: false, hint: "Optional, z.B. 2.0" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: false, hint: "Wird nicht öffentlich angezeigt" }
      - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "neuigkeiten"
    label: "Neuigkeiten"
    folder: "src/content/neuigkeiten"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Typ", name: "type", widget: "select", options: ["feature", "fix", "improvement", "announcement"], default: "announcement" }
      - { label: "Version", name: "version", widget: "string", required: false, hint: "Optional, z.B. 2.0" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: false, hint: "Wird nicht öffentlich angezeigt" }
      - { label: "Inhalt", name: "body", widget: "markdown" }
